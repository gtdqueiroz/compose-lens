[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compose-lens"
version = "0.1.0"
description = "An explainable, offline Docker Compose configuration reviewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
compose-lens = "compose_lens.cli:main"

[tool.setuptools.packages.find]
include = ["compose_lens*"]
